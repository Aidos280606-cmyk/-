<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Гуми мені кешірші ❤️</title>
<style>
body{margin:0;min-height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#ffb6c8;font-family:Arial}
.card{text-align:center}h1{font-size:32px;margin:0 0 12px}p{font-size:18px;margin-bottom:25px}
button{border:0;border-radius:8px;padding:14px 28px;font-size:18px;font-weight:bold;cursor:pointer}
#yes{background:#16a637;color:#fff}#no{background:#e71919;color:#fff;position:absolute}
#message{display:none;font-size:27px;font-weight:bold;color:#c41448;margin-top:25px}
.heart{position:fixed;font-size:25px;animation:fall 2.5s linear forwards}@keyframes fall{to{transform:translateY(100vh) scale(1.4);opacity:0}}
</style></head>
<body><div class="card">
<h1>Гуми мені кешірші ❤️</h1><p>Кешіресің ба?</p>
<button id="yes">Ия</button><button id="no">Жоқ</button>
<div id="message">Рахмет ❤️ Мен сені қатты жақсы көремін!</div>
</div>
<script>
const no=document.getElementById('no'),yes=document.getElementById('yes'),msg=document.getElementById('message');
function move(){no.style.left=Math.random()*(innerWidth-100)+'px';no.style.top=Math.random()*(innerHeight-100)+'px'}
no.onmouseenter=move;no.ontouchstart=e=>{e.preventDefault();move()};
yes.onclick=()=>{msg.style.display='block';yes.style.display='none';no.style.display='none';
for(let i=0;i<35;i++)setTimeout(()=>{let h=document.createElement('div');h.className='heart';h.textContent='❤️';h.style.left=Math.random()*100+'vw';h.style.top='-30px';document.body.appendChild(h);setTimeout(()=>h.remove(),4000)},i*70)}
</script></body></html>
